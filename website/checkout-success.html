<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're all set | FatClipboard</title>
<link rel="stylesheet" href="./tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #F6F3ED;
    --creamSurface: #FFFFFF;
    --ink: #313851;
    --inkMuted: #666E85;
    --borderLight: rgba(49,56,81,0.14);
    --accent: #FD105E;
    --accentFill: #FDE3EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream); color: var(--ink);
    font-family: "Segoe UI Variable", "Segoe UI", -apple-system, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 380px; width: 100%; text-align: center;
    background: var(--creamSurface); border: 1px solid var(--borderLight);
    border-radius: 20px; padding: 40px 32px;
    box-shadow: 0 24px 48px -16px rgba(26,24,22,0.16);
  }
  .logo { height: 26px; width: auto; margin-bottom: 24px; }
  .badge {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accentFill);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
  }
  .badge i { font-size: 24px; color: var(--accent); }
  h1 { font-family: "Newsreader", serif; font-size: 22px; font-weight: 500; margin: 0 0 10px; }
  p { font-size: 14px; color: var(--inkMuted); line-height: 1.6; margin: 0 0 6px; }
  .fineprint { font-size: 12px; color: var(--inkMuted); margin-top: 20px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./assets/fatclipboard-wordmark.png" alt="FatClipboard" />
    <div class="badge"><i class="ti ti-check"></i></div>
    <h1>You're all set</h1>
    <p>Your Pro trial has started. Switch back to FatClipboard. It checks automatically within a few seconds and unlocks everything on its own.</p>
    <p>You can close this tab now.</p>
    <p class="fineprint">Manage or cancel anytime from Settings in the app.</p>
  </div>
</body>
</html>
