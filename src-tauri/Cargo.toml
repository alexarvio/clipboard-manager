[package]
name = "clipboard-manager"
version = "0.1.0"
description = "A clipboard manager that doesn't look like it's from 2003."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# Native "choose a file" dialog for TransformTab's image upload (see
# main.rs::ocr_uploaded_image) -- only its Rust API is used (app.dialog()),
# never invoked from JS, so no capabilities/ACL entry is needed for it.
tauri-plugin-dialog = "2"
# Auto-updates (see docs/auto-updates.md): checks a GitHub Release's
# latest.json on startup, and if it's a newer version than this build,
# downloads + verifies it against the public key in tauri.conf.json, then
# installs and relaunches. Only used from Rust (main.rs's setup()), never
# invoked from JS, so no capabilities/ACL entry is needed -- same reasoning
# as tauri-plugin-dialog above.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
enigo = "0.2"
chrono = "0.4"
once_cell = "1"
dirs = "5"
# Used for best-effort clipboard-content classification (link/email/phone/
# address/bank account) that powers the Pro-only history filter.
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Opens the system's default browser for Stripe Checkout / the Billing
# Portal (see billing commands in main.rs). Deliberately not a Tauri plugin
# (e.g. tauri-plugin-opener) -- this is only ever called from inside Rust
# command bodies, never invoked directly from JS, so it doesn't need a
# capabilities/ACL entry the way a JS-invokable plugin command would (same
# reasoning as tauri-plugin-dialog's app.dialog() usage above).
open = "5"
# Screenshots feature (Pro-only, see db.rs "Screenshots" section): decodes
# the raw RGBA buffer arboard::get_image() returns and encodes it to PNG for
# on-disk storage, plus generates the smaller thumbnail used in list views.
# jpeg/webp added 2026-08-01 for TransformTab's "upload a picture" OCR input
# (see main.rs::ocr_image_data) -- unlike captured screenshots (always PNG),
# a photo picked from disk is most commonly a JPEG (phone camera) or
# sometimes WebP, so decoding needs to handle those too.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Encodes thumbnail PNG bytes as a data URI so the frontend can render them
# straight from list_screenshots without a second round-trip per image.
base64 = "0.22"
# Screenshot OCR (see src/ocr.rs): Windows.Media.Ocr is a built-in WinRT API
# (ships with Windows 10/11, no extra install, no cloud vision API bill),
# chosen specifically to keep OCR text extraction local -- consistent with
# the rest of the Screenshots feature's "never uploaded" privacy story.
# NOTE: this is the one dependency in this file that hasn't been verified
# against a real `cargo build` yet (see ocr.rs's own doc comment) -- if the
# exact API surface has moved between windows-rs versions, this version
# pin/feature list is the first thing to check.
# 2026-08-19: five Win32_* features added for clipboard_listener.rs's
# event-driven clipboard capture (AddClipboardFormatListener + a hidden
# message-only window), replacing the old fixed-interval polling loop in
# main.rs. Win32_Foundation/_UI_WindowsAndMessaging cover the window
# creation and message loop, Win32_System_DataExchange has
# AddClipboardFormatListener itself, Win32_System_LibraryLoader has
# GetModuleHandleW (needed for RegisterClassW's hInstance). Win32_Graphics_Gdi
# was an unexpected fifth one -- RegisterClassW/WNDCLASSW turned out to be
# gated behind it too (a windows-rs metadata quirk, nothing GDI-specific is
# actually used here), caught by cargo build reporting "no WNDCLASSW in
# Win32::UI::WindowsAndMessaging -- found an item that was configured out".
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Globalization",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
] }

[[bin]]
name = "clipboard-manager"
path = "src/main.rs"
