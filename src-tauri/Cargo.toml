[package]
name = "clipboard-manager"
version = "0.1.0"
description = "A clipboard manager that doesn't look like it's from 2003."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
enigo = "0.2"
chrono = "0.4"
once_cell = "1"
dirs = "5"
# Used for best-effort clipboard-content classification (link/email/phone/
# address/bank account) that powers the Pro-only history filter.
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "clipboard-manager"
path = "src/main.rs"
